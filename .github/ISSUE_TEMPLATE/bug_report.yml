name: Bug report
description: Report a problem with the FRITZ!Smart Monitor applet.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first and remove any sensitive information (such as public IP addresses, device identifiers, or credentials).
  - type: textarea
    id: summary
    attributes:
      label: Describe the problem
      description: A clear and concise description of what is not working.
      placeholder: Tell us what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the steps needed to reproduce the behavior.
      placeholder: |
        1. Open the applet...
        2. Expand...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant error messages or logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Applet version
      description: The installed version (for example, from About or your package manager).
      placeholder: 0.7.3
    validations:
      required: true
  - type: input
    id: cosmic
    attributes:
      label: COSMIC version
      description: Include your COSMIC Desktop / Epoch version if known.
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Pop!_OS 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs or screenshots. Redact personal and network information.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed passwords, tokens, public IP addresses, and other sensitive information.
          required: true
