name: Publish GitHub Pages to gh-pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate and publish site
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Install Markdown renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-markdown
      - name: Render Markdown documentation
        run: python3 scripts/build-pages.py
      - name: Validate generated site
        run: python3 scripts/validate-pages.py
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          force_orphan: true
          enable_jekyll: false
          commit_message: "docs: publish ${{ github.sha }}"

  report-failure:
    name: Track publishing failures
    needs: [publish]
    if: always() && needs.publish.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create or update Pages failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="[Actions] GitHub Pages publishing failure"
          body="## GitHub Pages publishing failed

          - Workflow run: ${RUN_NUMBER}
          - Triggered by: @${ACTOR}
          - Commit: ${SHA}
          - Run: ${RUN_URL}

          The documentation build, validation or gh-pages deployment failed.
          This issue is maintained automatically; subsequent failures are added as comments."
          existing="$(gh issue list --state open --search 'in:title "[Actions] GitHub Pages publishing failure"' --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
