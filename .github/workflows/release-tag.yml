name: Create release tag

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# Serialize version bumps so concurrent manual releases cannot race on main.
concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    # Manual runs and pushes to main are supported; feature branches are ignored.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump package version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run the release action from the main branch." >&2
            exit 1
          fi

          # A merge can land after the initial fetch but before the push.
          # Recalculate the version from the newest main and retry only when
          # the remote branch actually advanced.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            base_sha="$(git rev-parse HEAD)"

            new_version="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          match = re.search(r'(?ms)^\[package\]\s+.*?^version\s*=\s*"([0-9]+)\.([0-9]+)\.([0-9]+)"\s*$', text)
          if not match:
              raise SystemExit("Could not find a stable [package].version in Cargo.toml")

          major, minor, patch = map(int, match.groups())
          bump = os.environ["BUMP_TYPE"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported bump type: {bump}")

          new_version = f"{major}.{minor}.{patch}"
          updated, count = re.subn(pattern, lambda match: match.group(1) + os.environ["NEW_VERSION"] + match.group(2), text, count=1)
              r'(?ms)(^\[package\]\s+.*?^version\s*=\s*")[0-9]+\.[0-9]+\.[0-9]+("\s*$)',
              rf'\g<1>{new_version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Failed to update [package].version")
          path.write_text(updated)
          print(new_version)
          PY
            )"

            echo "Bumping package version to ${new_version} (attempt ${attempt}/5)"
            NEW_VERSION="$new_version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.lock")
          text = path.read_text()
          pattern = r'(?ms)(\[\[package\]\]\nname = "fritz-power-monitor"\nversion = ")[^"]+(")'
          updated, count = re.subn(pattern, rf'\\g<1>{os.environ["NEW_VERSION"]}\\g<2>', text, count=1)
          if count != 1:
              raise SystemExit("Could not update the root package version in Cargo.lock")
          path.write_text(updated)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): bump version to ${new_version}"

            if git push origin HEAD:main; then
              echo "Pushed version bump ${new_version}."
              exit 0
            fi

            git fetch origin main
            remote_sha="$(git rev-parse origin/main)"
            if [[ "${remote_sha}" == "${base_sha}" ]]; then
              echo "Push failed although main did not advance; check RELEASE_TOKEN and branch permissions." >&2
              exit 1
            fi
            echo "main advanced during the bump; retrying against ${remote_sha}."
          done

          echo "Could not publish version bump after 5 attempts because main kept advancing." >&2
          exit 1

      - name: Create or repair version tag
        shell: bash
        run: |
          set -euo pipefail

          event_version=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            previous_version="$(git show "${GITHUB_SHA}^:Cargo.toml" 2>/dev/null | sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' | head -n1 || true)"
            event_version="$(git show "${GITHUB_SHA}:Cargo.toml" | sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' | head -n1)"
            if [[ -z "$event_version" || "$event_version" == "$previous_version" ]]; then
              echo "Cargo.toml package version did not change; no release tag is needed."
              exit 0
            fi
          fi

          # Tag the newest main commit that still carries this package version,
          # not the older version-bump commit. This includes fixes merged while
          # the tag workflow is queued.
          git fetch origin main
          version="$(git show origin/main:Cargo.toml | sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not read Cargo.toml package version from main" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "$version" != "$event_version" ]]; then
            echo "main now contains version $version, superseding event version $event_version; skipping stale tag run."
            exit 0
          fi

          tag="v${version}"
          release_commit="$(git rev-parse origin/main)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            existing_commit="$(git rev-list -n1 "$tag")"
            if [[ "$existing_commit" == "$release_commit" ]]; then
              echo "$tag already points to $release_commit; nothing to do."
              exit 0
            fi
            echo "$tag already exists at $existing_commit; refusing to move a published release tag." >&2
            exit 1
          fi

          git tag --annotate "$tag" "$release_commit" --message "Release $tag"
          git push origin "refs/tags/$tag"
          echo "Created immutable tag $tag at $release_commit"
