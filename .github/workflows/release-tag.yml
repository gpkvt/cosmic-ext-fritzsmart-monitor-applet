name: Create release tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag-release:
    # The manual run handles its own version-bump push. Skip the duplicate
    # push-triggered run for that commit; ordinary main pushes still tag.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): bump version to ')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bump package version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run the release action from the main branch." >&2
            exit 1
          fi

          new_version="$(python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("Cargo.toml")
          lines = path.read_text().splitlines()
          in_package = False
          version_line = None
          for index, line in enumerate(lines):
              if line.strip() == "[package]":
                  in_package = True
                  continue
              if line.startswith("["):
                  in_package = False
              if in_package and line.startswith("version = "):
                  version_line = index
                  break

          if version_line is None:
              raise SystemExit("Could not find [package].version in Cargo.toml")

          current = lines[version_line].split('"')[1]
          parts = current.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Expected stable MAJOR.MINOR.PATCH version, got {current!r}")
          major, minor, patch = map(int, parts)

          bump = os.environ["BUMP_TYPE"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported bump type: {bump}")

          new_version = f"{major}.{minor}.{patch}"
          lines[version_line] = f'version = "{new_version}"'
          path.write_text("\n".join(lines) + "\n")
          print(new_version)
          PY
          )"
          echo "Bumping package version to ${new_version}"
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to ${new_version}"
          git push origin HEAD:main

      - name: Create or repair version tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const cargo = fs.readFileSync('Cargo.toml', 'utf8');
            const version = cargo.match(/^version = "([^"]+)"/m)?.[1];
            if (!version) throw new Error('Could not read Cargo.toml package version');

            const tag = `v${version}`;
            const history = execFileSync('git', [
              'log', '--first-parent', '-G', `^version = "${version}"`,
              '--format=%H', '--', 'Cargo.toml'
            ], { encoding: 'utf8' }).trim();
            const releaseCommit = history.split('\n')[0];
            if (!releaseCommit) throw new Error(`Could not find the commit that introduced ${version}`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let existing;
            try {
              existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              let target = existing.data.object.sha;
              if (existing.data.object.type === 'tag') {
                const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: target });
                target = annotated.data.object.sha;
              }
              if (target === releaseCommit) {
                core.info(`${tag} already points to the version bump commit.`);
                return;
              }
              core.warning(`${tag} points to ${target}; repairing it to ${releaseCommit}.`);
              const annotated = await github.rest.git.createTag({
                owner,
                repo,
                tag,
                message: `Release ${tag}`,
                object: releaseCommit,
                type: 'commit',
                tagger: {
                  name: 'gpkvt',
                  email: 'git@21x9.org',
                  date: new Date().toISOString()
                }
              });
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha: annotated.data.sha,
                force: true
              });
              core.info(`Repaired ${tag} at ${releaseCommit}`);
              return;
            }

            const annotated = await github.rest.git.createTag({
              owner,
              repo,
              tag,
              message: `Release ${tag}`,
              object: releaseCommit,
              type: 'commit',
              tagger: {
                name: 'gpkvt',
                email: 'git@21x9.org',
                date: new Date().toISOString()
              }
            });
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: annotated.data.sha
            });
            core.info(`Created ${tag} at ${releaseCommit}`);
