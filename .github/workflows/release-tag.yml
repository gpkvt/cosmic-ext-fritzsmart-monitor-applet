name: Create release tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release token
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add the RELEASE_TOKEN repository secret (Contents: write and Workflows: write), then run this workflow manually to create or repair the release tag."
          fi
      - name: Create or repair version tag
        if: steps.token.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const cargo = fs.readFileSync('Cargo.toml', 'utf8');
            const version = cargo.match(/^version = "([^"]+)"/m)?.[1];
            if (!version) throw new Error('Could not read Cargo.toml package version');

            const tag = `v${version}`;
            const history = execFileSync('git', [
              'log', '--first-parent', '-G', `^version = "${version}"`,
              '--format=%H', '--', 'Cargo.toml'
            ], { encoding: 'utf8' }).trim();
            const releaseCommit = history.split('\n')[0];
            if (!releaseCommit) throw new Error(`Could not find the commit that introduced ${version}`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let existing;
            try {
              existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              let target = existing.data.object.sha;
              if (existing.data.object.type === 'tag') {
                const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: target });
                target = annotated.data.object.sha;
              }
              if (target === releaseCommit) {
                core.info(`${tag} already points to the version bump commit.`);
                return;
              }
              core.warning(`${tag} points to ${target}; repairing it to ${releaseCommit}.`);
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            }

            const annotated = await github.rest.git.createTag({
              owner,
              repo,
              tag,
              message: `Release ${tag}`,
              object: releaseCommit,
              type: 'commit',
              tagger: {
                name: 'gpkvt',
                email: 'git@21x9.org',
                date: new Date().toISOString()
              }
            });
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: annotated.data.sha
            });
            core.info(`Created ${tag} at ${releaseCommit}`);