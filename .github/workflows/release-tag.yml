name: Create release tag

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# Serialize version bumps so concurrent manual releases cannot race on main.
concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    # Manual runs and pushes to main are supported; feature branches are ignored.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump package version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run the release action from the main branch." >&2
            exit 1
          fi

          # A queued manual run may have been created before an earlier run
          # finished. Always base the next version bump on the current main.
          git fetch origin main
          git reset --hard origin/main

          new_version="$(python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("Cargo.toml")
          lines = path.read_text().splitlines()
          in_package = False
          version_line = None
          for index, line in enumerate(lines):
              if line.strip() == "[package]":
                  in_package = True
                  continue
              if line.startswith("["):
                  in_package = False
              if in_package and line.startswith("version = "):
                  version_line = index
                  break

          if version_line is None:
              raise SystemExit("Could not find [package].version in Cargo.toml")

          current = lines[version_line].split('"')[1]
          parts = current.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Expected stable MAJOR.MINOR.PATCH version, got {current!r}")
          major, minor, patch = map(int, parts)

          bump = os.environ["BUMP_TYPE"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported bump type: {bump}")

          new_version = f"{major}.{minor}.{patch}"
          lines[version_line] = f'version = "{new_version}"'
          path.write_text("\n".join(lines) + "\n")
          print(new_version)
          PY
          )"
          echo "Bumping package version to ${new_version}"
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to ${new_version}"
          git push origin HEAD:main

      - name: Create or repair version tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            if [[ "$commit_message" == "chore(release): bump version to "* ]]; then
              echo "The manual release run handles this version bump; skipping duplicate tag creation."
              exit 0
            fi
          fi

          version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not read Cargo.toml package version" >&2
            exit 1
          fi

          tag="v${version}"
          release_commit="$(git log --first-parent -G "^version = \"${version}\"" --format=%H -- Cargo.toml | head -n1)"
          if [[ -z "$release_commit" ]]; then
            echo "Could not find the commit that introduced $version" >&2
            exit 1
          fi

          git config user.name "gpkvt"
          git config user.email "git@21x9.org"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            existing_commit="$(git rev-list -n1 "$tag")"
            if [[ "$existing_commit" == "$release_commit" ]]; then
              echo "$tag already points to $release_commit; nothing to do."
              exit 0
            fi
            echo "$tag already exists at $existing_commit; refusing to move a published release tag." >&2
            exit 1
          fi

          git tag --annotate "$tag" "$release_commit" --message "Release $tag"
          git push origin "refs/tags/$tag"
          echo "Created immutable tag $tag at $release_commit"
