name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop entry validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test
      - name: Check build
        run: cargo check
      - name: Test user-local installation
        run: |
          prefix="$RUNNER_TEMP/cosmic-solar-install"
          make install PREFIX="$prefix"
          desktop_file="$prefix/share/applications/com.gpkvt.CosmicSolarApplet.desktop"
          desktop-file-validate "$desktop_file"
          test -x "$prefix/bin/cosmic-solar-applet"
          grep -Fx "Exec=$prefix/bin/cosmic-solar-applet" "$desktop_file"
          make uninstall PREFIX="$prefix"
          test ! -e "$prefix/bin/cosmic-solar-applet"
          test ! -e "$desktop_file"
