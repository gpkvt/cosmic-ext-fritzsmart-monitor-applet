name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop entry validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils
      - name: Validate COSMIC applet desktop entry
        run: desktop-file-validate data/com.gpkvt.CosmicSolarApplet.desktop
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test
      - name: Check build
        run: cargo check
