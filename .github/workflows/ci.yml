name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  rust:
    name: Format, test, build and install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            flatpak-builder \
            python3-venv \
            libdbus-1-dev \
            libdisplay-info-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            dpkg-dev \
            patchelf \
            file
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/com.gpkvt.FritzPowerMonitor.desktop
          appstreamcli validate --no-net data/com.gpkvt.FritzPowerMonitor.metainfo.xml
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Generate locked Cargo dependencies
        run: cargo generate-lockfile
      - name: Prepare Flatpak Cargo sources
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check tomlkit aiohttp
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/flatpak-builder-tools"
          .venv/bin/python "$RUNNER_TEMP/flatpak-builder-tools/cargo/flatpak-cargo-generator.py" Cargo.lock -o cargo-sources.json
          mkdir -p flatpak-source
          cp Cargo.toml Cargo.lock build.rs flatpak-source/
          cp -r src data flatpak-source/
      - name: Upload reproducible Flatpak source inputs
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-source-inputs
          path: |
            Cargo.lock
            cargo-sources.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate Flatpak manifest
        run: flatpak-builder --show-manifest com.gpkvt.FritzPowerMonitor.yml > /dev/null
      - name: Install Flatpak build runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08
      - name: Build Flatpak application
        run: |
          flatpak-builder --user --force-clean --default-branch=stable \
            --repo=flatpak-repo build-flatpak com.gpkvt.FritzPowerMonitor.yml
      - name: Build and smoke-test distributable Flatpak bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/fritz-power-monitor-ci.flatpak"
          flatpak build-bundle flatpak-repo "$bundle" \
            com.gpkvt.FritzPowerMonitor stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --bundle "$bundle"
          flatpak uninstall --user --noninteractive com.gpkvt.FritzPowerMonitor
      - name: Run tests
        run: cargo test --locked
      - name: Check build
        run: cargo check --locked
      - name: Build optimized binary
        run: cargo build --release --locked
      - name: Build Debian and AppImage packages
        run: |
          APP_VERSION=0.0.0 OUTPUT_DIR="$RUNNER_TEMP/packages" bash packaging/build-linux-packages.sh
          test -s "$RUNNER_TEMP/packages/fritz-power-monitor_0.0.0_amd64.deb"
          test -x "$RUNNER_TEMP/packages/fritz-power-monitor-0.0.0-x86_64.AppImage"
          dpkg-deb --info "$RUNNER_TEMP/packages/fritz-power-monitor_0.0.0_amd64.deb"
      - name: Upload Debian and AppImage packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.AppImage
            ${{ runner.temp }}/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Test user-local installation
        run: |
          prefix="$RUNNER_TEMP/fritz-power-monitor-install"
          make install PREFIX="$prefix" UPDATE=0
          desktop_file="$prefix/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          desktop-file-validate "$desktop_file"
          test -x "$prefix/bin/fritz-power-monitor"
          icon_file="$prefix/share/icons/hicolor/scalable/apps/com.gpkvt.FritzPowerMonitor.svg"
          test -s "$icon_file"
          grep -Fx "Icon=com.gpkvt.FritzPowerMonitor" "$desktop_file"
          grep -Fx "Exec=$prefix/bin/fritz-power-monitor" "$desktop_file"
          grep -Fx "X-CosmicApplet=true" "$desktop_file"
          grep -Fx "X-CosmicShrinkable=true" "$desktop_file"
          grep -Fx "X-HostWaylandDisplay=true" "$desktop_file"
          grep -Fx "X-CosmicHoverPopup=Auto" "$desktop_file"
          make uninstall PREFIX="$prefix"
          test ! -e "$prefix/bin/fritz-power-monitor"
          test ! -e "$desktop_file"
          test ! -e "$icon_file"
