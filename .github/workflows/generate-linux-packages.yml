name: Generate Linux packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: generate-linux-packages-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian, AppImage and Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Determine package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fritz-power-monitor") | .version')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building fritz-power-monitor $version"

      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream desktop-file-utils flatpak flatpak-builder python3-venv \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config dpkg-dev patchelf file

      - name: Build all Linux packages
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          OUTPUT_DIR: dist
        run: bash packaging/build-linux-packages.sh

      - name: Verify generated packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/fritz-power-monitor_${VERSION}_amd64.deb"
          appimage="dist/fritz-power-monitor-${VERSION}-x86_64.AppImage"
          flatpak="dist/fritz-power-monitor-${VERSION}.flatpak"

          test -s "$deb"
          test -x "$appimage"
          test -s "$flatpak"
          test -s dist/SHA256SUMS
          dpkg-deb --info "$deb"
          file "$appimage"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: fritz-power-monitor-${{ steps.version.outputs.version }}-linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
