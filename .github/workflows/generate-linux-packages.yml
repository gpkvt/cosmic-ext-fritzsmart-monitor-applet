name: Build Linux packages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'packaging/**'
      - 'com.gpkvt.FritzPowerMonitor.yml'
      - '.github/workflows/generate-linux-packages.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}-main
  cancel-in-progress: false

jobs:
  packages:
    name: Build and validate Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Install Linux packaging dependencies
        run: bash packaging/install-ci-deps.sh

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate release helper
        run: python3 -m unittest discover -s packaging -p 'test_version.py'

      - name: Read source version
        id: version
        shell: bash
        run: |
          echo "version=$(python3 packaging/version.py current)" >> "$GITHUB_OUTPUT"

      - name: Format Rust sources (matching Release workflow)
        run: cargo fmt --all

      - name: Format, compile, lint and test
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Build Debian, AppImage, Flatpak and portable archive
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_RELEASE_VERSION: v${{ steps.version.outputs.version }}
          OUTPUT_DIR: dist
        run: bash packaging/build-linux-packages.sh

      - name: Verify package checksums and expected artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          test -s "fritz-power-monitor_${VERSION}_amd64.deb"
          test -s "fritz-power-monitor-${VERSION}-x86_64.AppImage"
          test -s "fritz-power-monitor-${VERSION}.flatpak"
          test -s "fritz-power-monitor-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"

      - name: Upload packages for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fritz-power-monitor-linux-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7
