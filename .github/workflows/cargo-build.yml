name: Cargo release build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/cargo-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/cargo-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --locked --release

      - name: Verify release binary
        run: test -x target/release/fritz-power-monitor

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: fritz-power-monitor-${{ runner.os }}-${{ runner.arch }}
          path: target/release/fritz-power-monitor
          if-no-files-found: error
          retention-days: 7
