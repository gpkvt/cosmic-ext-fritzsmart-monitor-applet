name: Format Rust sources

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - ".github/workflows/rustfmt.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: rustfmt-main
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(rustfmt):') }}
    name: Apply rustfmt formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Synchronize Cargo.lock
        run: cargo fetch

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatting changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All Rust sources are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' Cargo.lock
          git commit -m "style(rustfmt): format Rust sources"
          git push origin HEAD:main

          # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly run
          # the quality suite against the newly formatted main commit.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/dispatches" \
            -f ref=main
