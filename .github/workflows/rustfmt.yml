name: Format Rust sources

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - ".github/workflows/rustfmt.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: rustfmt-main
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(rustfmt):') }}
    name: Apply rustfmt formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Synchronize Cargo.lock
        run: cargo fetch

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatting changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All Rust sources are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' Cargo.lock
          git commit -m "style(rustfmt): format Rust sources"

          # Other main-branch updates can land while rustfmt is running.
          # Rebase our formatting commit onto the newest main and retry a
          # rejected push rather than failing on a harmless race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Could not push rustfmt commit after five attempts." >&2
              exit 1
            fi
            sleep 2
          done

          # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly run
          # the quality suite against the newly formatted main commit.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/dispatches" \
            -f ref=main
