name: Project pipeline

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version increment (release only)
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: project-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-commit, tests and validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install validation and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            flatpak \
            flatpak-builder \
            pre-commit \
            python3-markdown \
            python3-venv \
            libdbus-1-dev \
            libdisplay-info-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            dpkg-dev \
            patchelf \
            file
      - name: Run pre-commit on every tracked file
        run: pre-commit run --all-files
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked
      - name: Check Rust build
        run: cargo check --locked
      - name: Render and validate documentation
        run: |
          python3 scripts/build-pages.py
          python3 scripts/validate-pages.py
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/com.gpkvt.FritzPowerMonitor.desktop
          appstreamcli validate --no-net data/com.gpkvt.FritzPowerMonitor.metainfo.xml
      - name: Validate Flatpak manifest
        run: flatpak-builder --show-manifest com.gpkvt.FritzPowerMonitor.yml > /dev/null
      - name: Upload rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: rendered-documentation
          path: docs/
          if-no-files-found: error
          retention-days: 7

  version:
    name: Resolve version and create release tag
    needs: checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Bump version and create immutable tag
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Run release dispatches from main only." >&2
              exit 1
            fi
            new_version="$(python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text()
          pattern = r'(?ms)(^\[package\]\s+.*?^version\s*=\s*")([0-9]+)\.([0-9]+)\.([0-9]+)(")'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit("Could not parse stable [package].version")
          major, minor, patch = map(int, match.groups()[1:4])
          bump = os.environ["BUMP_TYPE"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported bump type: {bump}")
          version = f"{major}.{minor}.{patch}"
          updated, count = re.subn(pattern, rf"\g<1>{version}\g<5>", text, count=1)
          if count != 1:
              raise SystemExit("Failed to update Cargo.toml")
          path.write_text(updated)
          print(version)
          PY
          )"
            NEW_VERSION="$new_version" python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("Cargo.lock")
          text = path.read_text()
          pattern = r'(?ms)(\[\[package\]\]\nname = "fritz-power-monitor"\nversion = ")[^"]+(")'
          updated, count = re.subn(pattern, lambda m: m.group(1) + os.environ["NEW_VERSION"] + m.group(2), text, count=1)
          if count != 1:
              raise SystemExit("Could not update root package version in Cargo.lock")
          path.write_text(updated)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): bump version to $new_version"
            git push origin HEAD:main
          else
            new_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          fi

          tag="v$new_version"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Release tag $tag already exists; refusing to move it." >&2
              exit 1
            fi
            git tag --annotate "$tag" HEAD --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  packages:
    name: Build Linux packages
    needs: [checks, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream desktop-file-utils flatpak flatpak-builder python3-venv \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config dpkg-dev patchelf file
      - name: Build Debian, AppImage and Flatpak packages
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          OUTPUT_DIR: dist
        run: bash packaging/build-linux-packages.sh
      - name: Verify package outputs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/fritz-power-monitor_${VERSION}_amd64.deb"
          test -x "dist/fritz-power-monitor-${VERSION}-x86_64.AppImage"
          test -s "dist/fritz-power-monitor-${VERSION}.flatpak"
          test -s dist/SHA256SUMS
          dpkg-deb --info "dist/fritz-power-monitor_${VERSION}_amd64.deb"
      - name: Assemble portable archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          name="fritz-power-monitor-${TAG}-x86_64-unknown-linux-gnu"
          dir="dist/${name}"
          mkdir -p "${dir}/bin" "${dir}/share/applications" "${dir}/share/metainfo" "${dir}/share/icons/hicolor/scalable/apps"
          install -Dm0755 target/release/fritz-power-monitor "${dir}/bin/fritz-power-monitor"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.desktop "${dir}/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.metainfo.xml "${dir}/share/metainfo/com.gpkvt.FritzPowerMonitor.metainfo.xml"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.svg "${dir}/share/icons/hicolor/scalable/apps/com.gpkvt.FritzPowerMonitor.svg"
          install -Dm0644 README.md "${dir}/README.md"
          install -Dm0644 LICENSE "${dir}/LICENSE"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
      - name: Upload packages for release job
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [version, packages]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          name: linux-release-packages
          path: dist
      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "dist/fritz-power-monitor-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/fritz-power-monitor-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "dist/fritz-power-monitor-${VERSION}.flatpak"
            "dist/fritz-power-monitor_${VERSION}_amd64.deb"
            "dist/fritz-power-monitor-${VERSION}-x86_64.AppImage"
            "dist/SHA256SUMS"
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --generate-notes --verify-tag
          fi
          assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name]')"
          for file in "${files[@]}"; do
            name="${file##*/}"
            jq -e --arg name "$name" 'index($name) != null' <<< "$assets" >/dev/null || {
              echo "Release asset missing after upload: $name" >&2
              exit 1
            }
          done

  publish-pages:
    name: Build and publish GitHub Pages
    needs: [version, packages, release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.version.result == 'success' &&
      needs.packages.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Install Markdown renderer
        run: sudo apt-get update && sudo apt-get install --yes python3-markdown
      - name: Render Markdown documentation
        run: python3 scripts/build-pages.py
      - name: Validate generated Pages site
        run: python3 scripts/validate-pages.py
      - uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  security-audit:
    name: Audit Rust dependencies
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependency advisories
        run: cargo audit --deny warnings

  report-failure:
    name: Track pipeline failures in GitHub Issues
    needs: [checks, dependency-review, security-audit, version, packages, release, publish-pages]
    if: >-
      always() &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create or update pipeline failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="[Actions] Pipeline failure"
          body="## Automated workflow failure

          - Workflow: ${RUN_NAME} #${RUN_NUMBER}
          - Branch/ref: ${BRANCH}
          - Triggered by: @${ACTOR}
          - Commit: ${SHA}
          - Run: ${RUN_URL}

          One or more pipeline jobs failed. Open the run above for the failing step logs.

          This issue is maintained automatically; subsequent failures are added as comments."
          existing="$(gh issue list --state open --search 'in:title "[Actions] Pipeline failure"' --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
