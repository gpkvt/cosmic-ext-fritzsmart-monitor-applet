name: Validate Linux packages

on:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify DEB, AppImage and Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 \
            appstream desktop-file-utils flatpak flatpak-builder python3-venv \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config dpkg-dev patchelf file

      - name: Determine package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "fritz-power-monitor") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian, AppImage and Flatpak packages
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          OUTPUT_DIR: dist
        run: bash packaging/build-linux-packages.sh

      - name: Verify packages and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/fritz-power-monitor_${VERSION}_amd64.deb"
          appimage="dist/fritz-power-monitor-${VERSION}-x86_64.AppImage"
          flatpak="dist/fritz-power-monitor-${VERSION}.flatpak"

          test -s "$deb"
          test -x "$appimage"
          test -s "$flatpak"
          test -s dist/SHA256SUMS

          [[ "$(dpkg-deb --field "$deb" Package)" == "fritz-power-monitor" ]]
          [[ "$(dpkg-deb --field "$deb" Version)" == "$VERSION" ]]
          [[ "$(dpkg-deb --field "$deb" Architecture)" == "amd64" ]]
          dpkg-deb --contents "$deb" | grep -F './usr/bin/fritz-power-monitor' >/dev/null
          file "$appimage"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload validated packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ steps.version.outputs.version }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
