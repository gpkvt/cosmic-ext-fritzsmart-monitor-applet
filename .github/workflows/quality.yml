name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit and integration tests
        run: cargo test --locked

  pages:
    name: Validate GitHub Pages sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Markdown renderer
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 python3-markdown

      - name: Build documentation
        run: python3 scripts/build-pages.py

      - name: Validate documentation
        run: python3 scripts/validate-pages.py
