name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Lint workflow files
        uses: raven-actions/actionlint@v2

  rust:
    name: Rust formatting, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          # Some GitHub runner images have only vendor apt sources enabled.
          # Restore the official Ubuntu archives only when the core dev packages
          # are missing, retaining signature verification.
          if ! apt-cache show libdbus-1-dev >/dev/null 2>&1; then
            . /etc/os-release
            if [[ "${ID:-}" != ubuntu || "${VERSION_CODENAME:-}" != noble ]]; then
              echo "Ubuntu Noble apt sources unavailable on unexpected runner" >&2
              exit 1
            fi
            sudo tee /etc/apt/sources.list.d/fritz-monitor-ubuntu.sources >/dev/null <<'SOURCES'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
            sudo apt-get update -o Acquire::Retries=3
          fi
          sudo apt-get install --yes -o Acquire::Retries=3 \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          fi

      - name: Check formatting for all Rust sources
        run: cargo fmt --all -- --check

      - name: Check all targets compile
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-targets

  pages:
    name: Build and validate GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python documentation dependency
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 python3-markdown

      - name: Validate Python scripts compile
        run: python3 -m py_compile scripts/build-pages.py scripts/validate-pages.py

      - name: Build documentation
        run: python3 scripts/build-pages.py

      - name: Validate generated documentation and local links
        run: python3 scripts/validate-pages.py

  packaging-script:
    name: Validate packaging script
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 shellcheck

      - name: Reject panel-generated hover clicks
        # COSMIC Panel treats the *presence* of X-CosmicHoverPopup as an
        # instruction to synthesize pointer presses; even "false" or "None"
        # is parsed to the Auto fallback. Menus are click-only in this applet.
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*X-CosmicHoverPopup[[:space:]]*=' data/com.gpkvt.FritzPowerMonitor.desktop; then
            echo 'Remove X-CosmicHoverPopup: COSMIC interprets this key as hover-to-click.' >&2
            exit 1
          fi

      - name: Check shell syntax
        run: |
          bash -n packaging/build-linux-packages.sh
          sh -n packaging/deb-postinst
          sh -n packaging/deb-prerm

      - name: Lint packaging scripts
        run: |
          shellcheck --severity=warning packaging/build-linux-packages.sh
          shellcheck --severity=warning --shell=sh packaging/deb-postinst packaging/deb-prerm
