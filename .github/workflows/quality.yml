name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Lint workflow files
        uses: raven-actions/actionlint@v2

  rust:
    name: Rust formatting, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 \
            libdbus-1-dev libdisplay-info-dev libgbm-dev libinput-dev libseat-dev \
            libsystemd-dev libudev-dev libvulkan-dev libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          fi

      - name: Check formatting for changed Rust sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          fi
          if [[ "$changed_files" == *".rs"* || "$changed_files" == *"build.rs"* ]]; then
            cargo fmt --all -- --check
          else
            echo "No Rust sources changed; formatting check not required."
          fi

      - name: Check all targets compile
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-targets

  pages:
    name: Build and validate GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python documentation dependency
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 python3-markdown

      - name: Validate Python scripts compile
        run: python3 -m py_compile scripts/build-pages.py scripts/validate-pages.py

      - name: Build documentation
        run: python3 scripts/build-pages.py

      - name: Validate generated documentation and local links
        run: python3 scripts/validate-pages.py

  packaging-script:
    name: Validate packaging script
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 shellcheck

      - name: Check shell syntax
        run: bash -n packaging/build-linux-packages.sh

      - name: Lint packaging script
        run: shellcheck --severity=warning packaging/build-linux-packages.sh
 <<< "$changed_files"; then
            cargo fmt --all -- --check
          else
            echo "No Rust sources changed; formatting check not required."
          fi

      - name: Check all targets compile
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-targets

  pages:
    name: Build and validate GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python documentation dependency
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 python3-markdown

      - name: Validate Python scripts compile
        run: python3 -m py_compile scripts/build-pages.py scripts/validate-pages.py

      - name: Build documentation
        run: python3 scripts/build-pages.py

      - name: Validate generated documentation and local links
        run: python3 scripts/validate-pages.py

  packaging-script:
    name: Validate packaging script
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -o Acquire::Retries=3 shellcheck

      - name: Check shell syntax
        run: bash -n packaging/build-linux-packages.sh

      - name: Lint packaging script
        run: shellcheck --severity=warning packaging/build-linux-packages.sh
