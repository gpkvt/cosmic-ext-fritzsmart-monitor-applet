name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Show unresolved pinned dependencies
        shell: python
        run: |
          import pathlib
          import tomllib

          packages = tomllib.loads(pathlib.Path("Cargo.lock").read_text())["package"]
          versions = {(pkg["name"], pkg["version"]) for pkg in packages}
          ignored = set(tomllib.loads(pathlib.Path(".cargo/audit.toml").read_text())["advisories"]["ignore"])
          tracked = [
              ("lru", "0.16.4", "RUSTSEC-2026-0253"),
              ("memmap2", "0.8.0", "RUSTSEC-2026-0186"),
          ]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Known transitive RustSec exceptions — issue #270\n\n")
              summary.write("These are **unresolved**, not remediated by the audit allow-list.\n\n")
              for name, version, advisory in tracked:
                  present = (name, version) in versions
                  if present:
                      assert advisory in ignored, f"Untracked unsound advisory: {advisory}"
                  state = "Present — still requires remediation" if present else "Absent — review and remove exception"
                  summary.write(f"- \`{name} {version}\` ({advisory}): {state}\n")
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependency advisories (deny all non-allowlisted warnings)
        run: cargo audit --deny warnings --file Cargo.lock

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
