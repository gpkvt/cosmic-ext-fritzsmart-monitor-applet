name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package and publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout main with publish permissions
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Ensure main has not changed since dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::main moved after the release was requested. Dispatch the release again."
            exit 1
          }

      - name: Install Linux packaging dependencies
        run: bash packaging/install-ci-deps.sh

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate version helper
        run: python3 -m unittest discover -s packaging -p 'test_version.py'

      - name: Compute new stable version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          version="$(python3 packaging/version.py bump "$BUMP")"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Release tag $tag already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Keep release builds reproducible even when earlier source commits
      # were not rustfmt-clean. Persist the formatted sources in the same
      # release commit as the version bump, so the published tag matches
      # exactly what was checked and packaged.
      - name: Format Rust sources for the release
        run: cargo fmt --all

      - name: Verify formatting, compilation, Clippy and tests
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Build Debian, AppImage, Flatpak and portable archive
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_RELEASE_VERSION: ${{ steps.version.outputs.tag }}
          OUTPUT_DIR: dist
        run: bash packaging/build-linux-packages.sh

      - name: Verify packages and SHA256 checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          test -s "fritz-power-monitor_${VERSION}_amd64.deb"
          test -s "fritz-power-monitor-${VERSION}-x86_64.AppImage"
          test -s "fritz-power-monitor-${VERSION}.flatpak"
          test -s "fritz-power-monitor-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"

      - name: Commit version and publish main plus tag atomically
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # cargo fmt may have changed tracked Rust sources. Include those
          # files in the release commit: otherwise the tag differs from the
          # tested and packaged binary, and the next release fails again.
          git add Cargo.toml Cargo.lock
          git add -u -- '*.rs'
          git diff --exit-code
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "FRITZ!Power Monitor $TAG"
          # If main moves or a tag collides, push neither ref.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG:refs/tags/$TAG"

      - name: Publish GitHub Release with downloadable packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes

      - name: Upload packages as Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-packages
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
