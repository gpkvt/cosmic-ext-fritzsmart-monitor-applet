name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Linux release package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libdisplay-info-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            flatpak \
            flatpak-builder \
            python3-venv \
            dpkg-dev \
            desktop-file-utils \
            patchelf \
            file
      - name: Format Rust sources and run tests
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo test --locked
      - name: Build optimized binary
        run: APP_RELEASE_VERSION="${GITHUB_REF_NAME#v}" cargo build --release --locked
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          binary="target/release/fritz-power-monitor"
          package_dir="$RUNNER_TEMP/deb-package"
          install -Dm0755 "$binary" "$package_dir/usr/bin/fritz-power-monitor"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.desktop \
            "$package_dir/usr/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          sed -i 's|^Exec=.*|Exec=/usr/bin/fritz-power-monitor|' \
            "$package_dir/usr/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.svg \
            "$package_dir/usr/share/icons/hicolor/scalable/apps/com.gpkvt.FritzPowerMonitor.svg"
          install -Dm0644 README.md "$package_dir/usr/share/doc/fritz-power-monitor/README.md"
          install -Dm0644 LICENSE "$package_dir/usr/share/doc/fritz-power-monitor/copyright"
          mkdir -p debian
          cat > debian/control <<'CONTROL'
          Source: fritz-power-monitor
          Section: utils
          Priority: optional
          Maintainer: FRITZ!Power Monitor contributors
          Standards-Version: 4.6.2

          Package: fritz-power-monitor
          Architecture: amd64
          Description: FRITZ!Box power monitor for the COSMIC desktop
           COSMIC panel applet for monitoring FRITZ!Box smart-home power
           generation, consumption and temperature readings.
          CONTROL
          depends="$(dpkg-shlibdeps -O -e"$binary" | sed -n 's/^shlibs:Depends=//p')"
          rm -rf debian
          test -n "$depends"
          mkdir -p "$package_dir/DEBIAN" dist
          cat > "$package_dir/DEBIAN/control" <<EOF
          Package: fritz-power-monitor
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: FRITZ!Power Monitor contributors
          Depends: $depends
          Description: FRITZ!Box power monitor for the COSMIC desktop
           COSMIC panel applet for monitoring FRITZ!Box smart-home power
           consumption, generation and temperature readings.
          EOF
          desktop-file-validate "$package_dir/usr/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          dpkg-deb --build --root-owner-group "$package_dir" \
            "dist/fritz-power-monitor_${version}_amd64.deb"
          dpkg-deb --info "dist/fritz-power-monitor_${version}_amd64.deb"
      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage" \
            --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            --appdir AppDir \
            --executable target/release/fritz-power-monitor \
            --desktop-file data/com.gpkvt.FritzPowerMonitor.desktop \
            --icon-file data/com.gpkvt.FritzPowerMonitor.svg \
            --output appimage
          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" "dist/fritz-power-monitor-${version}-x86_64.AppImage"
          chmod +x "dist/fritz-power-monitor-${version}-x86_64.AppImage"
          file "dist/fritz-power-monitor-${version}-x86_64.AppImage"
      - name: Checksum Debian and AppImage packages
        run: |
          cd dist
          sha256sum *.deb *.AppImage > SHA256SUMS
      - name: Prepare Flatpak Cargo sources
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check tomlkit aiohttp
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/flatpak-builder-tools"
          .venv/bin/python "$RUNNER_TEMP/flatpak-builder-tools/cargo/flatpak-cargo-generator.py" Cargo.lock -o cargo-sources.json
          mkdir -p flatpak-source
          cp Cargo.toml Cargo.lock build.rs flatpak-source/
          cp -r src data flatpak-source/
      - name: Install Flatpak build runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --default-branch=stable \
            --repo=flatpak-repo build-flatpak com.gpkvt.FritzPowerMonitor.yml
          mkdir -p dist
          flatpak build-bundle flatpak-repo \
            "dist/fritz-power-monitor-${GITHUB_REF_NAME}.flatpak" \
            com.gpkvt.FritzPowerMonitor stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub
          sha256sum dist/*.flatpak > "dist/fritz-power-monitor-${GITHUB_REF_NAME}.flatpak.sha256"
      - name: Assemble release archive
        shell: bash
        run: |
          set -euo pipefail
          package_name="fritz-power-monitor-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/bin" \
            "${package_dir}/share/applications" \
            "${package_dir}/share/icons/hicolor/scalable/apps"
          install -Dm0755 target/release/fritz-power-monitor "${package_dir}/bin/fritz-power-monitor"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.desktop \
            "${package_dir}/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.svg \
            "${package_dir}/share/icons/hicolor/scalable/apps/com.gpkvt.FritzPowerMonitor.svg"
          install -Dm0644 README.md "${package_dir}/README.md"
          install -Dm0644 LICENSE "${package_dir}/LICENSE"
          archive="dist/${package_name}.tar.gz"
          tar -C dist -czf "${archive}" "${package_name}"
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
