name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build or repair (for example v0.7.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build Linux release package
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="${RELEASE_TAG#v}"
          manifest_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "Tag version $package_version does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libdisplay-info-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            flatpak \
            flatpak-builder \
            python3-venv \
            dpkg-dev \
            desktop-file-utils \
            appstream \
            patchelf \
            file
      - name: Check Rust formatting and run tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/com.gpkvt.FritzPowerMonitor.desktop
          appstreamcli validate --no-net data/com.gpkvt.FritzPowerMonitor.metainfo.xml
      - name: Build Debian, AppImage and Flatpak packages
        run: |
          package_version="${RELEASE_TAG#v}"
          APP_VERSION="$package_version" \
          APP_RELEASE_VERSION="$package_version" \
          OUTPUT_DIR=dist bash packaging/build-linux-packages.sh
      - name: Assemble release archive
        shell: bash
        run: |
          set -euo pipefail
          package_name="fritz-power-monitor-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/bin" \
            "${package_dir}/share/applications" \
            "${package_dir}/share/metainfo" \
            "${package_dir}/share/icons/hicolor/scalable/apps"
          install -Dm0755 target/release/fritz-power-monitor "${package_dir}/bin/fritz-power-monitor"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.desktop \
            "${package_dir}/share/applications/com.gpkvt.FritzPowerMonitor.desktop"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.metainfo.xml \
            "${package_dir}/share/metainfo/com.gpkvt.FritzPowerMonitor.metainfo.xml"
          install -Dm0644 data/com.gpkvt.FritzPowerMonitor.svg \
            "${package_dir}/share/icons/hicolor/scalable/apps/com.gpkvt.FritzPowerMonitor.svg"
          install -Dm0644 README.md "${package_dir}/README.md"
          install -Dm0644 LICENSE "${package_dir}/LICENSE"
          archive="dist/${package_name}.tar.gz"
          tar -C dist -czf "${archive}" "${package_name}"
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Verify and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="${RELEASE_TAG#v}"
          files=(
            "dist/fritz-power-monitor-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/fritz-power-monitor-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "dist/fritz-power-monitor-${package_version}.flatpak"
            "dist/fritz-power-monitor_${package_version}_amd64.deb"
            "dist/fritz-power-monitor-${package_version}-x86_64.AppImage"
            "dist/SHA256SUMS"
          )

          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required release asset is missing or empty: $file" >&2
              echo "Available dist files:" >&2
              find dist -maxdepth 1 -type f -printf '%f\n' | sort >&2
              exit 1
            fi
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --verify-tag
          fi

          # Confirm the release actually exposes every required asset before
          # allowing the Pages workflow to publish the new download links.
          release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]')"
          for file in "${files[@]}"; do
            asset_name="${file##*/}"
            if ! jq -e --arg name "$asset_name" 'index($name) != null' <<<"$release_assets" >/dev/null; then
              echo "Release asset was not published: $asset_name" >&2
              exit 1
            fi
          done
