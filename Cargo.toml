[package]
name = "fritz-power-monitor"
version = "2.0.7"
edition = "2024"
description = "FRITZ!Box power monitor for the COSMIC desktop panel"
license = "MIT"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = [
    "applet",
    "applet-token",
    "tokio",
    "wayland",
    "winit",
] }
tokio = { version = "1", features = ["fs", "process", "time"] }
sha2 = "0.11"
zbus = "5.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mdns-sd = "0.13"
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
roxmltree = "0.20"
md-5 = "0.10"
hex = "0.4"
chrono = "0.4"
futures = "0.3"
notify-rust = "4"
